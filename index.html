<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarSwipe — İkinci El Araç Alım Satım</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0ede8; display: flex; height: 100vh; overflow: hidden; color: #111; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 200px; min-width: 200px; background: #fff;
      border-right: 1px solid #eee;
      display: flex; flex-direction: column;
      padding-top: 24px; padding-bottom: 24px;
    }
    .logo {
      font-size: 20px; font-weight: 900; color: #E53935;
      letter-spacing: -0.5px; padding: 0 20px; margin-bottom: 32px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 20px; cursor: pointer;
      border-radius: 10px; margin: 2px 8px;
      font-size: 14px; font-weight: 500; color: #555;
      transition: background .15s, color .15s;
      text-decoration: none;
    }
    .nav-item:hover { background: #fff0f0; color: #E53935; }
    .nav-item.active { background: #fff0f0; color: #E53935; font-weight: 700; }
    .nav-icon {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .nav-item.active .nav-icon { background: #E53935; color: #fff; }
    .nav-item:not(.active) .nav-icon { background: transparent; color: #aaa; }

    /* ── MAIN ── */
    .main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* Phone frame */
    .phone-frame {
      width: 320px; height: 640px;
      background: #fff;
      border-radius: 44px;
      box-shadow: 0 0 0 8px #222, 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
      display: flex; flex-direction: column;
    }
    /* Notch bar */
    .phone-notch {
      background: #222;
      height: 28px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .phone-notch-bar {
      width: 80px; height: 5px; background: #555; border-radius: 3px;
    }

    /* Card inside phone */
    .card-area {
      flex: 1; position: relative; overflow: hidden; background: #111;
    }
    .card-img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: opacity .3s;
    }
    .card-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent 30%, rgba(0,0,0,0.72) 100%);
      padding: 40px 18px 16px;
      color: #fff;
    }
    .card-name { font-size: 20px; font-weight: 900; line-height: 1.15; margin-bottom: 4px; }
    .card-price { font-size: 16px; font-weight: 700; color: #43A047; margin-bottom: 4px; }
    .card-meta { font-size: 12px; color: rgba(255,255,255,0.75); margin-bottom: 4px; }
    .card-seller { font-size: 12px; color: rgba(255,255,255,0.65); }

    /* Swipe labels */
    .swipe-label {
      position: absolute; top: 20px; padding: 5px 14px;
      border-radius: 8px; font-size: 20px; font-weight: 900;
      letter-spacing: 2px; opacity: 0; pointer-events: none;
      transition: opacity .15s; border: 3px solid;
    }
    .label-like { left: 14px; color: #43A047; border-color: #43A047; transform: rotate(-12deg); }
    .label-pass { right: 14px; color: #E53935; border-color: #E53935; transform: rotate(12deg); }

    /* Photo dots */
    .photo-dots {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; gap: 4px;
    }
    .dot { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.35); }
    .dot.active { background: #fff; }

    /* Bottom bar inside phone */
    .phone-bottom {
      background: #fff; padding: 12px 0 10px; flex-shrink: 0;
    }

    /* Action buttons */
    .actions {
      display: flex; align-items: center; justify-content: center;
      gap: 16px;
    }
    .act-btn {
      border-radius: 50%; border: 2px solid; background: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px;
      transition: transform .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .act-btn:hover { transform: scale(1.12); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .act-btn.sm { width: 46px; height: 46px; font-size: 18px; }
    .act-btn.lg { width: 58px; height: 58px; font-size: 26px; }
    .btn-undo { border-color: #F9A825; color: #F9A825; }
    .btn-pass { border-color: #E53935; color: #E53935; }
    .btn-like { border-color: #E91E8C; color: #E91E8C; }
    .btn-super { border-color: #42A5F5; color: #42A5F5; }

    @media (max-width: 700px) { .sidebar { display: none; } }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">CarSwipe</div>

  <a class="nav-item active" onclick="setActive(this)">
    <div class="nav-icon">🔍</div>
    Keşfet
  </a>
  <a class="nav-item" onclick="setActive(this)">
    <div class="nav-icon">≡</div>
    Filtrele
  </a>
  <a class="nav-item" onclick="setActive(this)">
    <div class="nav-icon">♡</div>
    Beğeniler
  </a>
  <a class="nav-item" onclick="setActive(this)">
    <div class="nav-icon">💬</div>
    Mesajlar
  </a>
  <a class="nav-item" onclick="setActive(this)">
    <div class="nav-icon">👤</div>
    Profil
  </a>
</div>

<!-- MAIN -->
<div class="main">
  <div class="phone-frame">
    <!-- Notch -->
    <div class="phone-notch"><div class="phone-notch-bar"></div></div>

    <!-- Card -->
    <div class="card-area">
      <img id="card-img" class="card-img" src="https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?w=700&q=80" alt="">

      <div class="photo-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="card-overlay">
        <div class="card-name" id="card-name">Toyota Corolla 2022</div>
        <div class="card-price" id="card-price">895.000 ₺</div>
        <div class="card-meta" id="card-meta">📍 İstanbul · Kadıköy · 22.000 km</div>
        <div class="card-seller" id="card-seller">Sahibinden</div>
      </div>

      <div class="swipe-label label-like" id="label-like">BEĞENDİM</div>
      <div class="swipe-label label-pass" id="label-pass">GEÇTİM</div>
    </div>

    <!-- Bottom -->
    <div class="phone-bottom">
      <div class="actions">
        <button class="act-btn sm btn-undo" title="Geri Al" onclick="void 0">↺</button>
        <button class="act-btn lg btn-pass" title="Geç" onclick="animatePass()">✕</button>
        <button class="act-btn lg btn-like" title="Beğen" onclick="animateLike()">♥</button>
        <button class="act-btn sm btn-super" title="Süper Beğen" onclick="void 0">★</button>
      </div>
    </div>
  </div>
</div>

<script>
const cars = [
  { name:'Toyota Corolla 2022', price:'895.000 ₺', meta:'📍 İstanbul · Kadıköy · 22.000 km', seller:'Sahibinden', img:'photo-1606664515524-ed2f786a0bd6' },
  { name:'Volkswagen Golf 2022', price:'985.000 ₺', meta:'📍 Bursa · Nilüfer · 52.000 km', seller:'Sahibinden', img:'photo-1619767886558-efdc259cde1a' },
  { name:'BMW 3 Serisi 2021', price:'1.450.000 ₺', meta:'📍 İstanbul · Kadıköy · 38.000 km', seller:'Galeriden', img:'photo-1555215695-3004980ad54e' },
  { name:'Honda Civic 2020', price:'725.000 ₺', meta:'📍 İzmir · Bornova · 67.000 km', seller:'Sahibinden', img:'photo-1494976388531-d1058494cdd8' },
  { name:'Audi A4 2022', price:'1.850.000 ₺', meta:'📍 İstanbul · Beşiktaş · 22.000 km', seller:'Galeriden', img:'photo-1542362567-b07e54358753' },
  { name:'Porsche Cayenne 2019', price:'3.200.000 ₺', meta:'📍 İstanbul · Sarıyer · 45.000 km', seller:'Galeriden', img:'photo-1553440569-bcc63803a83d' },
];

let idx = 0;

function loadCard(i) {
  idx = i % cars.length;
  const c = cars[idx];
  document.getElementById('card-img').src = `https://images.unsplash.com/${c.img}?w=700&q=80`;
  document.getElementById('card-name').textContent = c.name;
  document.getElementById('card-price').textContent = c.price;
  document.getElementById('card-meta').textContent = c.meta;
  document.getElementById('card-seller').textContent = c.seller;
}

function animateLike() {
  const lbl = document.getElementById('label-like');
  lbl.style.opacity = '1';
  setTimeout(() => { lbl.style.opacity = '0'; loadCard(idx + 1); }, 600);
}

function animatePass() {
  const lbl = document.getElementById('label-pass');
  lbl.style.opacity = '1';
  setTimeout(() => { lbl.style.opacity = '0'; loadCard(idx + 1); }, 600);
}

function setActive(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
